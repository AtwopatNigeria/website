<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATWOPAT Login</title>

  <link rel="stylesheet" href="css/login.css" />
  <script defer src="js/form-utils.js"></script>
  <script defer src="js/script.js"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    /* Success Overlay Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      display: none; /* Triggered by script.js */
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      font-family: sans-serif;
    }

    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2;
      stroke-miterlimit: 10;
      stroke: #22c55e;
      fill: #22c55e;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }

    .checkmark {
      width: 80px; height: 80px;
      border-radius: 50%;
      display: block;
      stroke-width: 5;
      stroke: #fff;
      margin: 0 auto 20px;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.7s forwards;
    }

    @keyframes stroke { 100% { stroke-dashoffset: 0; } }

    .status-title { color: #1e293b; font-size: 24px; margin: 10px 0; font-weight: bold; }
    .status-message { color: #64748b; font-size: 16px; }
  </style>
</head>

<body>

  <div class="container">
    <div class="login-card">

      <!-- LOGO -->
      <div class="logo-box">
        <img src="logo.png" alt="ATWOPAT Logo" class="logo">
      </div>

      <!-- TITLE -->
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue to ATWOPAT Portal</p>

      <!-- MESSAGE -->
      <div id="messageBox"></div>

      <!-- FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="input-group">
          <i class="fa-regular fa-user"></i>
          <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
          >
          <span class="clear-btn" onclick="clearInput('email')">
            <i class="fa-solid fa-circle-xmark"></i>
          </span>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          >
          <span class="toggle-btn" onclick="togglePassword()">
            <i class="fa-solid fa-eye-slash" id="toggleIcon"></i>
          </span>
        </div>

        <!-- CAPTCHA -->
        <div class="input-group captcha-group">
          <i class="fa-solid fa-shield-halved"></i>
          <input
            type="text"
            id="captchaInput"
            placeholder="Verification Code"
            required
          >
          <div class="captcha-box">
            <span id="captchaText"></span>
          </div>
        </div>

        <!-- OPTIONS -->
        <div class="options">
          <label>
            <input type="checkbox">
            Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="login-btn">
          Sign In
        </button>

      </form>

      <!-- REGISTER -->
      <p class="register-text">
        Don’t have an account?
        <a href="register.html">Create Account</a>
      </p>

      <!-- FOOTER -->
      <div class="footer-links">
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms.html">Terms of Service</a>
        <a href="support.html">Support</a>
      </div>

    </div>
  </div>

  <!-- SUCCESS OVERLAY (Hidden by default) -->
  <div id="success-modal" class="modal-overlay">
    <div class="modal-content">
      <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
      </svg>
      <h2 class="status-title">Login Successful!</h2>
      <p class="status-message">Redirecting to your dashboard...</p>
    </div>
  </div>

</body>
</html>
